[project]
name = "vilier"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "ngocbao220", email = "ngocbaotrinhtuan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=1.30.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyannote-audio>=4.0",
    "scipy>=1.15.3",
    "setuptools<81",
    "silero-vad>=6.2.1",
    "soundfile>=0.14.0",
    "speechbrain>=1.1.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.0",
]

[project.scripts]
vilier = "vilier:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
